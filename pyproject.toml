[project]
name = "store-release-ops"
version = "0.1.0"
description = "Zero-API ledger CLI for tracking Play Console / App Store Connect release status (Riteangle / Pocket Dating Coach)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
store-ops = "store_release_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_release_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
